name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          version=4.7.2
          base="https://github.com/godotengine/godot-builds/releases/download/${version}-stable"
          curl -fL --retry 3 -o /tmp/godot.zip "${base}/Godot_v${version}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v${version}-stable_linux.x86_64
          sudo ln -s /tmp/godot-bin/Godot_v${version}-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 -o /tmp/templates.tpz "${base}/Godot_v${version}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${version}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${version}.stable/"
      - name: Import project and validate scenes
        run: |
          godot --headless --editor --path . --import --quit
          godot --headless --path . --script res://tests/maze_check.gd
          godot --headless --path . --quit-after 90
      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required SDK packages
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;35.0.1" "platforms;android-35"
      - name: Reuse private debug signing key
        uses: actions/cache@v4
        with:
          path: /tmp/paclite-debug.keystore
          key: paclite-personal-debug-key-v1
      - name: Configure Godot Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          if [ ! -s /tmp/paclite-debug.keystore ]; then
            keytool -genkeypair -v -keystore /tmp/paclite-debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "/tmp/paclite-debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/PacLite-debug.apk
          test -s build/PacLite-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PacLite-debug-${{ github.sha }}
          path: build/PacLite-debug.apk
          if-no-files-found: error
